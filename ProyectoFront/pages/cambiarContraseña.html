<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPRIT - Nueva contraseña</title>
    <link rel="icon" type="image/png"href="https://cdn.aptoide.com/imgs/f/1/1/f11d378a1b576edc07805780a94f5ad2_fgraphic.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="/ProyectoFront/assets/css/cambiarContraseña.css">
</head>

<body>

    <div class="reset-container">

        <div class="logo">
            <h1>☰SPRIT</h1>
        </div>

        <h2 class="title">
            Crear nueva contraseña
        </h2>

        <p class="subtitle">
            Ingresa tu nueva contraseña y confírmala para continuar.
        </p>

        <div class="input-group">

            <label>Nueva contraseña</label>

            <input type="password" id="newPassword" placeholder="Ingresa tu nueva contraseña">

        </div>

        <div class="input-group">

            <label>Confirmar contraseña</label>

            <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña">

        </div>

        <button class="save-btn" id="savePassword">
            Guardar contraseña
        </button>

        <small id="msg"></small>

    </div>
    <script src="/ProyectoFront/assets/js/cambiarContraseña.js"></script>
</body>

</html>
