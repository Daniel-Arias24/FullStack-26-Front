<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout</title>
  <link rel="icon" type="image/png" href="https://cdn.aptoide.com/imgs/f/1/1/f11d378a1b576edc07805780a94f5ad2_fgraphic.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ProyectoFront/assets/css/checkout.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .error-msg {
      color: #d10000;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 10px;
      display: block;
    }

    input.error {
      border-color: #d10000;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold">☰SPRIT | Checkout</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <i class="fa fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="/ProyectoFront/index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/ProyectoFront/pages/registroVenta.html">Admin</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="fa fa-shopping-cart"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="alert">
  <img src="https://esprit.vtexassets.com/assets/vtex.file-manager-graphql/images/5c19e1e0-86c6-4d4f-9c08-3c251678b541___0714756f42f84ac1f8a9b56059420fc2.jpg">
</div>

<main>
  <section class="form-section">
    <h2><span class="step-number">1</span> Identificación</h2>
    <p>Solicitamos únicamente la información esencial para la finalización de la compra.</p>

    <form id="checkoutForm" novalidate>

      <label for="email">Correo</label>
      <input type="email" id="email" required>
      <small class="error-msg"></small>

      <div class="name-fields">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required>
          <small class="error-msg"></small>
        </div>
        <div>
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" required>
          <small class="error-msg"></small>
        </div>
      </div>

      <label for="telefono">Teléfono / Móvil</label>
      <input type="tel" id="telefono" pattern="[0-9\s]{7,15}" required>
      <small class="error-msg"></small>

      <div class="checkbox-field">
        <input type="checkbox" id="privacy" required>
        <label for="privacy">Entiendo y acepto la autorización para el tratamiento de mis datos personales.</label>
      </div>
      <small class="error-msg"></small>

      <button type="submit" class="submit-btn">Finalizar compra</button>
    </form>
  </section>

  <aside class="summary-section">
    <h3>Resumen de compra</h3>

    <div class="product-summary">
      <img src="https://picsum.photos/409/200">
      <div class="product-info">
        <p>Trench coat doble botonadura con cinturón para mujer Negro L</p>
        <p class="product-price">$529.900</p>
      </div>
    </div>

    <div class="discount-code">
  <input type="text" id="discountCode" placeholder="Ingresa tu código de descuento">
  <button type="button" id="applyDiscountBtn">Aplicar</button>
</div>
<small class="error-msg" id="discountMsg"></small>

    <div class="totals">
      <p>Subtotal <span>$529.900</span></p>
      <p class="total">Total <span>$529.900</span></p>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById('checkoutForm');

form.addEventListener('submit', function (e) {
  e.preventDefault();

  let valid = true;
  const inputs = form.querySelectorAll('input[required]');

  inputs.forEach(input => {
    const errorMsg = input.parentElement.querySelector('.error-msg') || input.nextElementSibling;

    input.classList.remove('error');
    if (errorMsg) errorMsg.textContent = '';

    if (!input.checkValidity()) {
      valid = false;
      input.classList.add('error');

      if (errorMsg) {
        if (input.type === 'email') {
          errorMsg.textContent = 'Ingresa un correo válido';
        } else if (input.type === 'tel') {
          errorMsg.textContent = 'Ingresa un teléfono válido';
        } else if (input.type === 'checkbox') {
          errorMsg.textContent = 'Debes aceptar este campo';
        } else {
          errorMsg.textContent = 'Este campo es obligatorio';
        }
      }
    }
  });

  if (valid) {
    alert('Compra finalizada. ¡Gracias!');
  }
});

const discountInput = document.getElementById('discountCode');
const discountBtn = document.getElementById('applyDiscountBtn');
const discountMsg = document.getElementById('discountMsg');
const subtotalEl = document.querySelector('.totals span');
const totalEl = document.querySelector('.total span');

let subtotal = 529900;

discountBtn.addEventListener('click', () => {
  const code = discountInput.value.trim().toUpperCase();
  discountInput.classList.remove('error');
  discountMsg.textContent = '';
  
  if (code === '') {
    discountInput.classList.add('error');
    discountMsg.textContent = 'Ingresa un código';
    return;
  }

  if (code === 'DESCUENTO10') {
    const total = subtotal * 0.9;
    totalEl.textContent = `$${Math.floor(total)}`;
    discountMsg.textContent = 'Descuento aplicado ✔️';
    discountMsg.style.color = 'green';
  } else {
    discountInput.classList.add('error');
    discountMsg.textContent = 'Código inválido';
    discountMsg.style.color = '#d10000';
  }
});
</script>

</body>
</html>
