<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas | Chevignon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/registro.css">
</head>
<body>
    <main class="fondo">
        <div class="capa-oscura">

            <div class="container d-flex justify-content-center align-items-center vh-100">

                <div class="col-12 col-md-8 col-lg-6">

                    <div class="formulario-ventas">

                        <h2 class="titulo">Tienda CHEVIGNON</h2>
                        <p class="subtitulo">Registro de ventas - Sucursal San Diego</p>

                        <hr>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">Vendedor</label>
                                <select class="form-select input-form">
                                    <option selected disabled>Selecciona un vendedor</option>
                                    <option>Pablo Serna</option>
                                    <option>Santiago Mejía</option>
                                    <option>Nicolás Parra</option>
                                    <option>Jessica Mora</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha</label>
                                    <input type="date" class="form-control input-form">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Local</label>
                                    <input type="text" class="form-control input-form"
                                        placeholder="Centro Comercial (Local)">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Productos</label>
                                <textarea class="form-control input-form" rows="3"
                                    placeholder="Ej: Chaqueta, Jeans, Camiseta"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Costo total</label>
                                <input type="number" class="form-control input-form" placeholder="$ 0">
                            </div>

                            <div class="d-grid">
                                <button class="btn boton-guardar">Registrar venta</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
